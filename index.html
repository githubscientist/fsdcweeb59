<!DOCTYPE html>
<html>

    <head>
        <title>CSS: Cascading Style Sheets</title>

        <!-- internal css styling -->
        <style>
            /* css selectors */
            /* html tag selectors */
            /* rulesets */
            h1 {
                /* rules or properties */
                /* key: value pair */
                color: purple;
                font-size: 96px;
            }
        </style>
    </head>

    <body>
        <h1>Hello World!</h1>
    </body>

</html>
